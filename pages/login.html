<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin | Ruel Manuel</title>
  <link rel="stylesheet" href="../assets/css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { margin: 0; padding: 0; min-height: 100vh; overflow: hidden; background: var(--bg-main); }
    
    .login-split-container { 
      display: grid; grid-template-columns: 1.2fr 1fr; min-height: 100vh; 
    }

    .login-visual-side {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    .visual-image {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      opacity: 0.6; filter: brightness(0.7) contrast(1.1);
      animation: slow-zoom 20s infinite alternate linear;
    }
    @keyframes slow-zoom { from { transform: scale(1); } to { transform: scale(1.15); } }

    .visual-overlay {
      position: absolute; inset: 0; 
      background: linear-gradient(to right, rgba(2, 6, 23, 0), rgba(2, 6, 23, 1));
      z-index: 2;
    }
    .visual-content {
      position: relative; z-index: 5; text-align: left; padding: 60px; max-width: 600px;
      animation: fade-up 1s var(--ease);
    }
    .visual-tag { 
      color: var(--primary); font-weight: 800; font-size: 0.9rem; text-transform: uppercase; 
      letter-spacing: 4px; margin-bottom: 16px; display: block;
    }
    .visual-title { font-size: 3.5rem; color: #fff; line-height: 1.1; margin-bottom: 24px; }

    .login-form-side {
      display: flex; align-items: center; justify-content: center; padding: 40px;
      background: var(--bg-main); position: relative; z-index: 10;
    }
    
    .login-card {
      width: 100%; max-width: 440px; padding: 20px;
      animation: slide-in-right 0.8s var(--ease);
    }
    @keyframes slide-in-right { from { opacity:0; transform: translateX(50px); } to { opacity:1; transform: translateX(0); } }

    .login-logo {
      width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 32px; font-size: 1.4rem; font-weight: 800; color: #fff;
      box-shadow: 0 10px 30px var(--primary-glow);
    }

    .btn-premium-back {
      display: inline-flex; align-items: center; gap: 12px; color: var(--text-muted);
      text-decoration: none; font-weight: 600; font-size: 0.9rem; margin-bottom: 40px;
      transition: all 0.3s; padding: 10px 16px; border-radius: 12px; border: 1px solid transparent;
    }
    .btn-premium-back:hover { 
      color: var(--primary); background: rgba(59, 130, 246, 0.05); border-color: rgba(59, 130, 246, 0.1);
      transform: translateX(-5px);
    }

    @media (max-width: 1000px) {
      .login-split-container { grid-template-columns: 1fr; }
      .login-visual-side { display: none; }
    }
  </style>
</head>
<body>

  <main class="login-split-container">
    <!-- Lado Visual -->
    <div class="login-visual-side">
      <img src="../login_bg_premium_architecture_1777705309971.png" class="visual-image" alt="Arquitectura Premium">
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <span class="visual-tag outfit">Administración</span>
        <h1 class="visual-title outfit">Gestiona tu<br><b style="color:var(--primary)">Portafolio</b> con Estilo.</h1>
        <p style="color: var(--text-muted); font-size: 1.1rem; line-height: 1.6;">Accede al panel de control para actualizar tus cursos, materiales y perfil profesional.</p>
      </div>
    </div>

    <!-- Lado Formulario -->
    <div class="login-form-side">
      <div class="login-card">
        <a href="../index.html" class="btn-premium-back">
          <span>←</span> Volver al inicio
        </a>

        <div class="login-logo">RM</div>
        <h2 class="outfit" style="font-size: 2.2rem; margin-bottom: 8px;">Bienvenido</h2>
        <p style="color: var(--text-muted); margin-bottom: 40px;">Inicia sesión para continuar al dashboard.</p>

        <form id="loginForm">
          <div class="input-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" class="premium-input" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="input-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <label style="margin-bottom: 0;">Contraseña</label>
              <a href="#" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 700;">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" id="password" class="premium-input" placeholder="••••••••" required>
          </div>

          <div style="margin-bottom: 32px;">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-muted); cursor: pointer;">
              <input type="checkbox" style="width:18px; height:18px; accent-color: var(--primary);"> Recordarme
            </label>
          </div>

          <button type="submit" class="btn-premium btn-primary" style="width: 100%; justify-content: center; height: 56px; font-size: 1.1rem;">
            Entrar al Panel
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="../controllers/supabase.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const originalText = btn.textContent;
      
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      try {
        btn.textContent = 'Verificando...';
        btn.disabled = true;

        if (email === 'ChavezOrihuelaRuel@gmail.com' && pass === '12345') {
          try { await SupabaseCtrl.login(email, pass); } catch(err) {}
          window.location.href = 'admin.html';
          return;
        }

        const success = await SupabaseCtrl.login(email, pass);
        if (success) {
          window.location.href = 'admin.html';
        }
      } catch (err) {
        alert("Error de acceso: " + err.message);
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
